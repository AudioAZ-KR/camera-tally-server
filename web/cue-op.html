<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flare Cue</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); max-width: 640px; margin: 0 auto; line-height: 1.5; }
  h1 { font-size: 24px; margin: 12px 0 4px; }
  p.sub { color: var(--muted); margin-bottom: 22px; font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin-bottom: 10px; }
  input { font-size: 18px; padding: 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); text-align: center; }
  input:disabled { opacity: .5; }
  button { font-size: 15px; padding: 12px; border-radius: 6px; border: 0; background: var(--brand); color: var(--bg); font-weight: bold; cursor: pointer; }
  button.sec { background: var(--border); color: var(--text); }
  button:disabled { opacity: .4; cursor: default; }
  .langsel { width: auto; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
  small { color: var(--muted); }
  #console { display: none; }

  #setup input { width: 100%; margin: 6px 0 12px; }
  #setup button { width: 100%; }
  #setup .genrow { display: flex; gap: 8px; } #setup .genrow button { flex: 1; }

  .code { font-size: 34px; font-weight: 700; font-family: var(--mono); letter-spacing: .08em; color: var(--text); }
  .tophead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  #connBadge { font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 4px; background: var(--border); color: var(--muted); white-space: nowrap; }
  #connBadge.on { background: #0a3d22; color: #4ade80; }

  /* 채널 행 */
  .chrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
           background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
  .chrow .meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chrow .name { font-size: 19px; font-weight: 900; letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chrow .cnt { font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 4px; background: var(--border); color: var(--muted); white-space: nowrap; }
  .chrow .cnt.on { background: #0a3d22; color: #4ade80; }
  .chrow .pill { font-size: 12px; font-weight: 900; letter-spacing: .06em; padding: 3px 10px; border-radius: 4px; background: var(--border); color: var(--muted); white-space: nowrap; }
  .chrow .pill.stby { background: var(--tally-pgm); color: #fff; }
  .chrow .pill.go { background: var(--tally-pvw); color: #fff; }
  .chrow .btns { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; }
  .chrow .btns button { padding: 12px 0; font-size: 15px; letter-spacing: .06em; }
  .bStby { background: #5a1210; color: #ffb4b0; } .bStby.act { background: var(--tally-pgm); color: #fff; }
  .bGo   { background: #0c3d26; color: #9ff0c3; } .bGo.act   { background: var(--tally-pvw); color: #fff; }
  .bOff  { background: var(--border); color: var(--text); }
  .bDel  { background: none; border: 1px solid var(--border); color: var(--muted); width: 42px; font-size: 16px; }

  .allrow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 12px; }
  .allrow button { padding: 13px 0; letter-spacing: .06em; }

  .addrow { display: flex; gap: 8px; margin-top: 12px; }
  .addrow input { flex: 1; text-align: left; font-size: 15px; padding: 10px 12px; }
  .addrow button { width: 90px; }

  .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .links a { display: block; text-align: center; padding: 10px 0; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; text-decoration: none; font-weight: bold; font-size: 14px; }

  /* ===== 큐 시트 ===== */
  .transport { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch;
               background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .curcue { min-width: 0; }
  .curcue small { display: block; font-size: 10px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
  .curcue b { font-size: 26px; font-family: var(--mono, ui-monospace, monospace); margin-right: 8px; }
  #curLabel { font-size: 16px; font-weight: 700; }
  .curnote { font-size: 13px; color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  .curch { font-size: 11px; color: var(--muted); font-weight: bold; letter-spacing: .05em; margin-top: 2px; }
  .tbtns { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .tbtns button { width: 108px; padding: 14px 0; font-size: 15px; letter-spacing: .08em; }
  .cuerow { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin: 6px 0; background: var(--bg); cursor: pointer; }
  .cuerow.cur { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  .cuerow.done { opacity: .45; }
  .cmain { display: flex; align-items: center; gap: 8px; }
  .cnum { font-family: var(--mono, ui-monospace, monospace); font-weight: 700; font-size: 15px; min-width: 44px; }
  .clabel { flex: 1; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cchips { font-size: 11px; color: var(--muted); font-weight: bold; white-space: nowrap; }
  .cbtn { background: none; border: 1px solid var(--border); color: var(--muted); width: 30px; height: 30px; padding: 0; font-size: 13px; border-radius: 4px; flex: none; }
  .cnote { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; word-break: break-all; }
  .cuerow.editing { cursor: default; }
  .cuerow.editing input, .cuerow.editing textarea { width: 100%; text-align: left; font-size: 14px; padding: 8px; margin-top: 6px; background: var(--surface); }
  .cuerow.editing .erow { display: flex; gap: 6px; }
  .cuerow.editing .erow input.enum { width: 84px; flex: none; }
  .chpick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chpick button { padding: 6px 12px; font-size: 12px; background: var(--border); color: var(--muted); }
  .chpick button.on { background: var(--brand); color: var(--bg); }
  textarea { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-family: var(--font); }
  #importText { width: 100%; font-size: 13px; padding: 10px; text-align: left; }
  .sheetadd { display: flex; gap: 8px; margin-top: 10px; }
  .sheetadd button { flex: 1; }

  /* ===== 타이머·공지 ===== */
  .tmview { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  #opClock { font-size: 20px; font-weight: 800; }
  .tmstat { font-size: 13px; color: var(--muted); font-weight: bold; }
  .tmstat.warn { color: #FFD166; } .tmstat.over { color: #FF6B6B; }
  .tmrow { display: flex; gap: 6px; margin-top: 8px; }
  .tmrow input { flex: 1; min-width: 0; font-size: 14px; padding: 9px; }
  .tmrow button { flex: 1; padding: 10px 0; font-size: 13px; }
</style>
</head>
<body>
<div class="brand-bar"><img src="/logo.svg" alt="AudioAZ" onerror="this.remove()"><select class="langsel" aria-label="Language"></select></div>
<h1 id="lblTitle">Flare Cue</h1>
<p class="sub" id="lblSub">채널별 STANDBY / GO를 스태프 스마트폰에 표시합니다</p>

<div id="setup">
  <div class="card">
    <h2 id="lblRoomTitle">방 코드</h2>
    <input id="room" placeholder="STAGE" autocapitalize="characters">
    <div class="genrow">
      <button class="sec" id="gen">코드 생성</button>
      <button id="start">콘솔 시작</button>
    </div>
  </div>
</div>

<div id="console">
  <div class="card">
    <div class="tophead"><span class="code" id="code"></span><span id="connBadge">…</span></div>
    <small id="lblShare">수신자에게 방 코드를 알려주거나 아래 링크를 공유하세요.</small>
    <div class="links" id="links"></div>
  </div>

  <div class="card">
    <h2 id="lblSheetTitle">큐 시트</h2>
    <div class="transport">
      <div class="curcue">
        <small id="lblNext">다음 큐</small>
        <b id="curNum">—</b><span id="curLabel"></span>
        <div class="curnote" id="curNote"></div>
        <div class="curch" id="curCh"></div>
      </div>
      <div class="tbtns">
        <button class="bStby" id="fireStby">STANDBY</button>
        <button class="bGo" id="fireGo">GO</button>
      </div>
    </div>
    <div id="cueList"></div>
    <div class="sheetadd">
      <button class="sec" id="addCue">큐 추가</button>
      <button class="sec" id="importBtn">가져오기</button>
    </div>
    <div id="importBox" style="display:none; margin-top:10px">
      <textarea id="importText" rows="7"></textarea>
      <div class="genrow" style="display:flex; gap:8px; margin-top:8px">
        <button class="sec" id="importCancel" style="flex:1">취소</button>
        <button id="importOk" style="flex:1">적용</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 id="lblTmTitle">타이머·공지</h2>
    <div class="tmview">
      <b id="opClock">--:--:--</b>
      <span class="tmstat" id="opTargetView"></span>
      <span class="tmstat" id="opTimerView"></span>
    </div>
    <div class="addrow">
      <input id="msgIn" placeholder="공지 입력" maxlength="200" style="text-align:left">
      <button id="msgSend">보내기</button>
      <button class="sec" id="msgClear">지우기</button>
    </div>
    <small id="opCurMsg" style="display:block; margin-top:6px"></small>
    <div class="tmrow">
      <input id="tMin" type="number" min="0" max="999" placeholder="분" inputmode="numeric">
      <input id="tSec" type="number" min="0" max="59" placeholder="초" inputmode="numeric">
      <button class="sec" id="tSet">설정</button>
      <button id="tStart">시작</button>
      <button class="sec" id="tPause">일시정지</button>
      <button class="sec" id="tReset">리셋</button>
    </div>
    <div class="tmrow">
      <input id="tTarget" type="time">
      <button class="sec" id="tgSet">목표 설정</button>
      <button class="sec" id="tgUnset">해제</button>
    </div>
  </div>

  <div class="card">
    <h2 id="lblChTitle">채널</h2>
    <div id="chList"></div>
    <div class="allrow">
      <button class="bStby" id="allStby">ALL STBY</button>
      <button class="bGo" id="allGo">ALL GO</button>
      <button class="bOff" id="allOff" style="background:var(--border);color:var(--text)">ALL OFF</button>
    </div>
    <div class="addrow">
      <input id="newCh" placeholder="채널 추가 (예: FLY)" autocapitalize="characters" maxlength="24">
      <button class="sec" id="addCh">추가</button>
    </div>
  </div>
  <button class="sec" id="back" style="width:100%" >처음으로</button>
</div>

        importPh:'Ein Cue pro Zeile:\nNummer | Ch1,Ch2 | Titel | Notiz\nz. B. 1 | LX,SND | Eröffnung | nach Blackout',
        apply:'Übernehmen', cancel:'Abbrechen', save:'Speichern',
        noCues:'Noch keine Cues. Hinzufügen oder importieren.',

  it: { title:'Flare Cue', sub:'Invia STANDBY / GO per canale agli smartphone della crew',
        roomTitle:'Codice sala', gen:'Genera', start:'Avvia console',
        share:'Condividi il codice sala o i link qui sotto.', chTitle:'Canali',
        addPh:'Aggiungi canale (es. FLY)', add:'Aggiungi', back:'Torna all’inizio', needRoom:'Inserisci un codice sala',
        connected:'Connesso', connecting:'Connessione…', reconnecting:'Riconnessione…',
        waitAck:'attesa conferma', acked:'CONF', devices:'',
        sheetTitle:'Lista cue', nextCue:'Prossimo cue', addCue:'Aggiungi cue', importBtn:'Importa',
        importPh:'Un cue per riga:\nnumero | ch1,ch2 | titolo | nota\nes. 1 | LX,SND | Apertura | dopo il buio',
        apply:'Applica', cancel:'Annulla', save:'Salva',
        noCues:'Nessun cue. Aggiungi o importa.',
        numPh:'N.', labelPh:'Titolo cue', notePh:'Nota',
        replaceAsk:'Sostituire la lista cue attuale? (Annulla = aggiungi in coda)',
        tmTitle:'Timer e avvisi', msgPh:'Scrivi un avviso', send:'Invia', clearMsg:'Cancella',

        tgSet:'Imposta obiettivo', tgUnset:'Rimuovi', minPh:'min', secPh:'sec',
        tgWord:'Obiettivo', tmWord:'Timer' }
};
function detectLang() {
  if (I18N[localStorage.lang]) return localStorage.lang;
  const sys = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
  const base = sys.split('-')[0];
  return I18N[base] ? base : 'en';
}
let lang = detectLang();
const t = k => I18N[lang][k];
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  $('lblTitle').textContent = t('title');
  $('lblSub').textContent = t('sub');
  $('lblRoomTitle').textContent = t('roomTitle');
  $('gen').textContent = t('gen');
  $('start').textContent = t('start');
  $('lblShare').textContent = t('share');
  $('lblChTitle').textContent = t('chTitle');
  $('newCh').placeholder = t('addPh');
  $('addCh').textContent = t('add');
  $('back').textContent = t('back');
  $('lblTmTitle').textContent = t('tmTitle');
  $('msgIn').placeholder = t('msgPh');
  $('msgSend').textContent = t('send');
  $('msgClear').textContent = t('clearMsg');
  $('tMin').placeholder = t('minPh');
  $('tSec').placeholder = t('secPh');
  $('tSet').textContent = t('tSet');
  $('tStart').textContent = t('tStart');
  $('tPause').textContent = t('tPause');
  $('tReset').textContent = t('tReset');
  $('tgSet').textContent = t('tgSet');
  $('tgUnset').textContent = t('tgUnset');
  $('lblSheetTitle').textContent = t('sheetTitle');
  $('lblNext').textContent = t('nextCue');
  $('addCue').textContent = t('addCue');
  $('importBtn').textContent = t('importBtn');
  $('importText').placeholder = t('importPh');
  $('importOk').textContent = t('apply');
  $('importCancel').textContent = t('cancel');
  renderLangSel(); renderConnBadge(); renderChannels(); renderSheet();
}
function setLang(l) { lang = l; localStorage.lang = l; applyLang(); }
function renderLangSel() {
  document.querySelectorAll('.langsel').forEach(sel => {
    if (!sel.options.length) sel.innerHTML = LANGS.map(([c, n]) => `<option value="${c}">${n}</option>`).join('');
    sel.value = lang;
  });
}
document.querySelectorAll('.langsel').forEach(sel => sel.onchange = () => setLang(sel.value));

// ===== 상태 =====
let ws, room, pingTimer, connected = false, manualClose = false;
let channels = [];                       // 오퍼레이터가 관리하는 채널 목록 (localStorage)
let srvState = {};                       // 서버 채널 상태 {ch:{state,ack,ts}}
let counts = {};                         // 채널별 접속 수신기 수
try { channels = JSON.parse(localStorage.cueChannels || '[]'); } catch {}
if (!channels.length) channels = ['LX', 'SND', 'VID', 'STAGE'];

function saveChannels() { localStorage.cueChannels = JSON.stringify(channels); }
function renderConnBadge() {
  const b = $('connBadge');
  b.textContent = connected ? t('connected') : t('connecting');
  b.className = connected ? 'on' : '';
  renderSheet();
}
function renderLinks() {
  $('links').innerHTML = channels.map(c =>
    `<a href="/cue.html?room=${encodeURIComponent(room)}&ch=${encodeURIComponent(c)}&auto=1" target="_blank">${c}</a>`).join('');
}
function renderChannels() {
  if (!room) return;
  $('chList').innerHTML = channels.map(c => {
    const s = srvState[c] || { state: 'off', ack: false };
    const n = counts[c] || 0;
    const pill = s.state === 'standby' ? `<span class="pill stby">STBY ${s.ack ? t('acked') : '· ' + t('waitAck')}</span>`
               : s.state === 'go' ? '<span class="pill go">GO</span>'
               : '<span class="pill">OFF</span>';
    return `<div class="chrow" data-ch="${esc(c)}">
      <div class="meta"><span class="name">${esc(c)}</span><span class="cnt${n ? ' on' : ''}">${n}${t('devices') || '×'}</span></div>
      ${pill}
      <div class="btns">
        <button class="bStby${s.state === 'standby' ? ' act' : ''}" data-st="standby">STBY</button>
        <button class="bGo${s.state === 'go' ? ' act' : ''}" data-st="go">GO</button>
        <button class="bOff" data-st="off">OFF</button>
        <button class="bDel" data-del="1">×</button>
      </div>
    </div>`;
  }).join('');
  renderLinks();
}
$('chList').addEventListener('click', e => {
  const row = e.target.closest('.chrow'); if (!row) return;
  const c = row.dataset.ch;
  if (e.target.dataset.del) {
    channels = channels.filter(x => x !== c); saveChannels();
    send({ type: 'cue_remove', ch: c });
    delete srvState[c]; renderChannels(); return;
  }
  const st = e.target.dataset.st;
  if (st) send({ type: 'cue', ch: c, state: st });
});
$('allStby').onclick = () => send({ type: 'cue_all', channels, state: 'standby' });
$('allGo').onclick   = () => send({ type: 'cue_all', channels, state: 'go' });
$('allOff').onclick  = () => send({ type: 'cue_all', channels, state: 'off' });
$('addCh').onclick = () => {
  const c = $('newCh').value.trim().toUpperCase().slice(0, 24);
  if (!c || channels.includes(c)) { $('newCh').value = ''; return; }
  channels.push(c); saveChannels(); $('newCh').value = '';
  renderChannels();
};
$('newCh').addEventListener('keydown', e => { if (e.key === 'Enter') $('addCh').click(); });

function send(obj) { try { ws?.readyState === 1 && ws.send(JSON.stringify(obj)); } catch {} }

// ===== 큐 시트 (SM 큐 스택) =====
let sheet = { cues: [], cur: 0 };
let editIdx = null;              // 편집 중인 큐 index — 편집 중엔 서버 갱신으로 폼을 덮지 않음
let sheetRestored = false;       // 서버가 비어 있을 때 로컬 백업을 1회만 복원
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => Math.random().toString(36).slice(2, 10);

function saveSheetLocal() { try { localStorage['cueSheet:' + room] = JSON.stringify(sheet); } catch {} }
function sendSheet() {
  let added = false;
  for (const q of sheet.cues) for (const c of q.channels) if (!channels.includes(c)) { channels.push(c); added = true; }
  if (added) { saveChannels(); renderChannels(); }
  send({ type: 'cue_sheet_set', cues: sheet.cues.map(({ _new, ...q }) => q), cur: sheet.cur });
  saveSheetLocal(); renderSheet();
}
function renderSheet() {
  if (!room || !$('cueList')) return;
  const cues = sheet.cues, cur = sheet.cur, c = cues[cur];
  $('curNum').textContent = c ? (c.num || '—') : '—';
  $('curLabel').textContent = c ? c.label : '';
  $('curNote').textContent = c ? c.note : '';
  $('curCh').textContent = c ? c.channels.join(' · ') : '';
  $('fireStby').disabled = $('fireGo').disabled = !c || !c.channels.length || !connected;
  $('cueList').innerHTML = cues.length ? cues.map((q, i) => {
    if (i === editIdx) return editForm(q, i);
    return `<div class="cuerow${i === cur ? ' cur' : ''}${i < cur ? ' done' : ''}" data-i="${i}">
      <div class="cmain">
        <span class="cnum">${esc(q.num)}</span>
        <span class="clabel">${esc(q.label)}</span>
        <span class="cchips">${esc(q.channels.join(','))}</span>
        <button class="cbtn" data-act="edit">✎</button>
        <button class="cbtn" data-act="ins">＋</button>
        <button class="cbtn" data-act="del">×</button>
      </div>
      ${q.note ? `<div class="cnote">${esc(q.note)}</div>` : ''}
    </div>`;
  }).join('') : `<small>${esc(t('noCues'))}</small>`;
}
function editForm(q, i) {
  const chs = [...new Set([...channels, ...q.channels])];
  return `<div class="cuerow editing" data-i="${i}">
    <div class="erow">
      <input class="enum" id="eNum" value="${esc(q.num)}" placeholder="${esc(t('numPh'))}">
      <input id="eLabel" value="${esc(q.label)}" placeholder="${esc(t('labelPh'))}">
    </div>
    <div class="chpick" id="ePick">${chs.map(c => `<button data-ch="${esc(c)}" class="${q.channels.includes(c) ? 'on' : ''}">${esc(c)}</button>`).join('')}</div>
    <textarea id="eNote" rows="2" placeholder="${esc(t('notePh'))}">${esc(q.note)}</textarea>
    <div class="erow" style="margin-top:6px">
      <button class="sec" data-act="cancel" style="flex:1">${esc(t('cancel'))}</button>
      <button data-act="save" style="flex:1">${esc(t('save'))}</button>
    </div>
  </div>`;
}
// 번호 규칙: 추가 = 마지막 정수+1, 삽입 = 앞 큐 번호에 .1 .2 … (콘솔 씬 번호 방식)
function nextMainNum() {
  let mx = 0;
  for (const q of sheet.cues) { const n = parseInt(q.num); if (!isNaN(n)) mx = Math.max(mx, n); }
  return String(mx + 1);
}
function pointNumAfter(i) {
  const base = sheet.cues[i]?.num || nextMainNum();
  const used = new Set(sheet.cues.map(q => q.num));
  for (let k = 1; k < 100; k++) { const cand = `${base}.${k}`; if (!used.has(cand)) return cand; }
  return base + '.x';
}
$('cueList').addEventListener('click', e => {
  const row = e.target.closest('.cuerow'); if (!row) return;
  const i = parseInt(row.dataset.i), act = e.target.dataset.act;
  if (row.classList.contains('editing')) {
    if (e.target.dataset.ch !== undefined) { e.target.classList.toggle('on'); return; }
    if (act === 'cancel') { if (sheet.cues[i] && sheet.cues[i]._new) sheet.cues.splice(i, 1); editIdx = null; renderSheet(); return; }
    if (act === 'save') {
      const q = sheet.cues[i]; delete q._new;
      q.num = document.getElementById('eNum').value.trim().slice(0, 16) || q.num;
      q.label = document.getElementById('eLabel').value.trim().slice(0, 80);
      q.note = document.getElementById('eNote').value.trim().slice(0, 300);
      q.channels = [...document.querySelectorAll('#ePick button.on')].map(b => b.dataset.ch);
      editIdx = null; sendSheet();
    }
    return;
  }
  if (act === 'edit') { editIdx = i; renderSheet(); return; }
  if (act === 'ins') {
    sheet.cues.splice(i + 1, 0, { id: uid(), num: pointNumAfter(i), label: '', note: '', channels: [], _new: true });
    editIdx = i + 1; renderSheet(); return;
  }
  if (act === 'del') { sheet.cues.splice(i, 1); if (sheet.cur >= sheet.cues.length) sheet.cur = Math.max(0, sheet.cues.length - 1); if (editIdx !== null && editIdx > i) editIdx--; sendSheet(); return; }
  sheet.cur = i; send({ type: 'cue_sheet_cur', cur: i }); renderSheet();
});
$('addCue').onclick = () => {
  sheet.cues.push({ id: uid(), num: nextMainNum(), label: '', note: '', channels: [], _new: true });
  editIdx = sheet.cues.length - 1; renderSheet();
};
$('fireStby').onclick = () => send({ type: 'cue_fire', index: sheet.cur, phase: 'standby' });
$('fireGo').onclick = () => send({ type: 'cue_fire', index: sheet.cur, phase: 'go' });

// ===== 타이머·공지 (탈리 호스트와 같은 방 단위 데이터 — 서버 msg/timer 기능 재사용) =====
let opTimer = { running: false, end: 0, remain: 0, target: 0 }, opClockOffset = 0;
const pad = n => String(n).padStart(2, '0');
function fmtT(ms, showH) {
  const over = ms < 0; ms = Math.abs(ms); const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (over ? '+' : '') + (h || showH ? `${h}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`);
}
function opTick() {
  const now = new Date();
  $('opClock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const srvNow = Date.now() + opClockOffset;
  const tg = $('opTargetView');
  if (opTimer.target) {
    const left = opTimer.target - srvNow, td = new Date(opTimer.target);
    tg.textContent = `${t('tgWord')} ${pad(td.getHours())}:${pad(td.getMinutes())} · ${fmtT(left, true)}`;
    tg.className = 'tmstat' + (left < 0 ? ' over' : left < 60000 ? ' warn' : '');
  } else tg.textContent = '';
  const tm = $('opTimerView');
  if (opTimer.running || opTimer.remain) {
    const left = opTimer.running ? opTimer.end - srvNow : opTimer.remain;
    tm.textContent = `${t('tmWord')} ${fmtT(left)}`;
    tm.className = 'tmstat' + (opTimer.running && left <= 0 ? ' over' : (opTimer.running && left < 10000 ? ' warn' : ''));
  } else tm.textContent = '';
}
setInterval(opTick, 250);
$('msgSend').onclick = () => { const x = $('msgIn').value.trim(); if (x) send({ type: 'msg', text: x }); };
$('msgIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('msgSend').click(); });
$('msgClear').onclick = () => { $('msgIn').value = ''; send({ type: 'msg', text: '' }); };
function timerSecs() { return Math.max(0, (parseInt($('tMin').value) || 0) * 60 + (parseInt($('tSec').value) || 0)); }
$('tSet').onclick = () => send({ type: 'timer', action: 'set', seconds: timerSecs() });
$('tStart').onclick = () => send({ type: 'timer', action: 'start' });
$('tPause').onclick = () => send({ type: 'timer', action: 'pause' });
$('tReset').onclick = () => send({ type: 'timer', action: 'reset', seconds: timerSecs() });
$('tgSet').onclick = () => {
  const v = $('tTarget').value; if (!v) return;
  const [h, m] = v.split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1);   // 지난 시각이면 내일로
  send({ type: 'timer', action: 'target', target_ms: d.getTime() });
};
$('tgUnset').onclick = () => send({ type: 'timer', action: 'target', target_ms: 0 });
$('importBtn').onclick = () => { $('importBox').style.display = 'block'; $('importText').focus(); };
$('importCancel').onclick = () => { $('importBox').style.display = 'none'; };
$('importOk').onclick = () => {
  const lines = $('importText').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) { $('importBox').style.display = 'none'; return; }
  const cues = lines.map((ln, i) => {
    const p = ln.split(/\s*(?:\||\t)\s*/);
    if (p.length === 1) return { id: uid(), num: String(i + 1), label: p[0].slice(0, 80), note: '', channels: [] };
    return { id: uid(), num: (p[0] || String(i + 1)).slice(0, 16),
             channels: (p[1] || '').split(',').map(s => s.trim().toUpperCase()).filter(Boolean),
             label: (p[2] || '').slice(0, 80), note: (p[3] || '').slice(0, 300) };
  });
  if (sheet.cues.length && confirm(t('replaceAsk'))) { sheet.cues = cues; sheet.cur = 0; }
  else sheet.cues = sheet.cues.concat(cues);
  editIdx = null; $('importBox').style.display = 'none'; $('importText').value = '';
  sendSheet();
};

$('gen').onclick = () => {
  $('room').value = Array.from({length: 6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
};
$('start').onclick = () => {
  room = $('room').value.trim().toUpperCase();
  if (!room) return alert(t('needRoom'));
  localStorage.cueOpRoom = room;
  $('setup').style.display = 'none'; $('console').style.display = 'block';
  $('code').textContent = room;
  history.replaceState(null, '', '?room=' + room);
  renderChannels(); connect(); keepAwake();
};
$('back').onclick = () => {
  manualClose = true; try { ws?.close(); } catch {} clearInterval(pingTimer);
  connected = false; history.replaceState(null, '', location.pathname);
  $('console').style.display = 'none'; $('setup').style.display = 'block';
};

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join', role: 'cueop', room }));
    connected = true; renderConnBadge();
    pingTimer = setInterval(() => ws.readyState === 1 && ws.send('{"type":"ping"}'), 8000);
  };
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'cue_state') {
      srvState = d.channels || {};
      // 서버에만 있는 채널(다른 콘솔이 만든 것)도 목록에 반영
      for (const c of Object.keys(srvState)) if (!channels.includes(c)) channels.push(c);
      saveChannels(); renderChannels();
    } else if (d.type === 'cue_roster') {
      counts = d.channels || {};
      for (const c of Object.keys(counts)) if (!channels.includes(c)) channels.push(c);
      saveChannels(); renderChannels();
    } else if (d.type === 'cue_sheet') {
      if (editIdx !== null) return;               // 편집 중 폼 보호 (저장 시 내 시트를 서버로 보냄)
      const remote = { cues: d.cues || [], cur: d.cur || 0 };
      if (!remote.cues.length && !sheetRestored) { // 서버(재시작 등)가 비어 있으면 로컬 백업 복원
        sheetRestored = true;
        try {
          const b = JSON.parse(localStorage['cueSheet:' + room] || 'null');
          if (b && b.cues && b.cues.length) { sheet = { cues: b.cues, cur: b.cur || 0 }; sendSheet(); return; }
        } catch {}
      }
      sheet = remote; saveSheetLocal(); renderSheet();
    } else if (d.type === 'msg') {
      $('opCurMsg').textContent = d.text || '';
    } else if (d.type === 'timer') {
      opTimer = d; if (d.now) opClockOffset = d.now - Date.now(); opTick();
    }
  };
  ws.onclose = () => {
    clearInterval(pingTimer); connected = false;
    if (manualClose) { manualClose = false; return; }
    renderConnBadge(); $('connBadge').textContent = t('reconnecting');
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}
let wakeLock;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (ws && ws.readyState !== 1 && $('console').style.display === 'block') connect(); } });
}

applyLang();
$('room').value = qs.get('room') || localStorage.cueOpRoom || '';
if (qs.get('room')) $('start').click();
</script>
